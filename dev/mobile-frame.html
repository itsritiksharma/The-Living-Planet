<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mobile frame (dev only)</title>
    <style>
      body { margin: 0; background: #777; display: flex; gap: 16px; align-items: flex-start; }
      iframe { border: 0; display: block; background: #fff; }
    </style>
  </head>
  <body>
    <!-- True 360/390 px viewports: media queries inside each frame respond to the frame width. -->
    <iframe src="visual-check.html#mid" width="390" height="2400" title="390 px viewport"></iframe>
    <iframe src="visual-check.html#mid" width="360" height="2400" title="360 px viewport"></iframe>
  </body>
</html>
